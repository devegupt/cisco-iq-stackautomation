spec_version: 2
description: >
  Cisco IQ Link on VMware vCenter. Deploys the Cisco IQ Link vSphere OVA (as shipped by Cisco),
  applies the getting-started-guide VM settings (full memory reservation, CPU shares Low,
  thick disks), then completes the first-boot console network setup (IP, gateway, DNS,
  search domain, NTP, admin password) unattended with govc keystrokes. Ends with the
  IQ Link installer URL; pairing with Cisco IQ (Device ID + claim code) stays a manual step.

inputs:
  Target:
    description: The vCenter to deploy into. Supplies the vCenter credentials and the management server that runs the automation.
    type: target
    target-filters:
      cloud-providers: [vcenter]

  Datacenter:
    description: vCenter datacenter
    depends-on: Target
    type: input-source
    source-name: vcenter
    overrides:
    - target_name: '{{ .inputs.["Target"] }}'
    - resource_type: datacenter

  Placement:
    description: Place the VM in a cluster, or on a standalone ESXi host (when the datacenter has no cluster).
    type: string
    style: radio
    allowed-values: [Cluster, Standalone ESXi host]
    default: Cluster

  Cluster:
    description: vCenter cluster. Ignored when Placement is "Standalone ESXi host".
    depends-on: Target, Datacenter
    type: input-source
    source-name: vcenter
    overrides:
    - target_name: '{{ .inputs.["Target"] }}'
    - resource_type: cluster
    - filter_datacenter: '{{ .inputs.["Datacenter"] }}'
    pattern: '^$|.*$'
    validation-description: Optional

  Host:
    description: ESXi host. Required for standalone placement; on clusters with vSphere HA or manual DRS, Cisco requires pinning the VM to a host.
    depends-on: Target, Datacenter
    type: input-source
    source-name: vcenter
    overrides:
    - target_name: '{{ .inputs.["Target"] }}'
    - resource_type: host
    - filter_datacenter: '{{ .inputs.["Datacenter"] }}'
    pattern: '^$|.*$'
    validation-description: Optional

  Datastore:
    description: Datastore for the VM (SSD recommended; disk write speed must exceed 70 MB/s).
    depends-on: Target, Datacenter
    type: input-source
    source-name: vcenter
    overrides:
    - target_name: '{{ .inputs.["Target"] }}'
    - resource_type: datastore
    - filter_datacenter: '{{ .inputs.["Datacenter"] }}'

  Folder:
    description: VM folder (optional)
    depends-on: Target, Datacenter
    type: input-source
    source-name: vcenter
    overrides:
    - target_name: '{{ .inputs.["Target"] }}'
    - resource_type: vm-folder-path
    - filter_datacenter: '{{ .inputs.["Datacenter"] }}'
    pattern: '^$|.*$'
    validation-description: Optional

  Network:
    description: Port group for the IQ Link management interface (mapped to the OVA network "DHCP Network"). Needs outbound TCP 443 to iq.cisco.com and the regional *.iq.cisco.com server, plus DNS/NTP.
    depends-on: Target, Datacenter
    type: input-source
    source-name: vcenter
    overrides:
    - target_name: '{{ .inputs.["Target"] }}'
    - resource_type: network
    - filter_datacenter: '{{ .inputs.["Datacenter"] }}'

  VM Name:
    description: Name of the IQ Link VM (lowercase letters, digits, hyphens).
    type: string
    default: cisco-iq-link
    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    validation-description: Lowercase letters, digits and hyphens; must start and end with a letter or digit

  OVA URL:
    description: Cisco IQ Link vSphere OVA, reachable over HTTP(S) from the management server.
    type: string
    default: http://ec2-34-207-244-85.compute-1.amazonaws.com/cisco-iq-link-vsphere-1.2.4-v1.2.4017.ova

  IQ Link Version:
    description: Release line of the OVA. 1.3.x asks an extra NTP poll-frequency question on the console.
    type: string
    style: radio
    allowed-values: ["1.2.x", "1.3.x"]
    default: "1.2.x"

  Deployment Size:
    description: >
      vCPU/RAM. "OVA default" keeps what the OVA ships with (16 vCPU / 32 GB for 1.2.4017).
      Other sizes follow the current Cisco IQ Link getting started guide:
      1K = 6 vCPU/12 GB, 10K = 8 vCPU/16 GB, 20K = 8 vCPU/18 GB, 50K = 12 vCPU/24 GB.
    type: string
    allowed-values: ["OVA default", "1K devices", "10K devices", "20K devices", "50K devices"]
    default: "OVA default"

  Disk Provisioning:
    description: Cisco recommends thick provisioning; thin risks storage over-commitment.
    type: string
    style: radio
    allowed-values: [thick, eagerZeroedThick, thin]
    default: thick

  Management IP:
    description: Static IPv4 address with prefix, e.g. 10.122.226.150/24. DHCP is not supported. Forward (A) and reverse (PTR) DNS records are required.
    type: string
    pattern: '^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)/([1-9]|[12][0-9]|3[0-2])$'
    validation-description: IPv4/prefix, e.g. 10.122.226.150/24

  Gateway:
    description: Default gateway IPv4 address
    type: string
    pattern: '^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'
    validation-description: IPv4 address

  DNS Servers:
    description: Comma-separated DNS server IPv4 addresses
    type: string
    pattern: '^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(,((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?))*$'
    validation-description: One or more IPv4 addresses, comma-separated, no spaces

  Search Domain:
    description: DNS search domain (optional; empty keeps the appliance default local.domain)
    type: string
    default: ""
    pattern: '^$|^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
    validation-description: Empty, or a lowercase domain name

  NTP Servers:
    description: Comma-separated NTP servers (hostnames or IPs)
    type: string
    pattern: '^[A-Za-z0-9.-]+(,[A-Za-z0-9.-]+)*$'
    validation-description: One or more hostnames/IPs, comma-separated, no spaces

  Admin Password:
    description: >
      New IQ Link admin password. At least 15 characters with 2+ uppercase, 2+ lowercase, 2+ digits
      and 2+ special characters, no repeated consecutive characters, US-keyboard ASCII only.
    type: string
    sensitive: true

outputs:
  IQ Link Installer:
    kind: link
    value: 'https://{{ .grains["iqlink-day0"].activities.deploy.commands.day0.outputs.mgmt_ip }}'
  Management IP:
    value: '{{ .grains["iqlink-day0"].activities.deploy.commands.day0.outputs.mgmt_ip }}'
  VM Name:
    value: '{{ .grains["iqlink-vm"].outputs.vm_name }}'
  vCPUs:
    value: '{{ .grains["iqlink-vm"].outputs.num_cpu }}'
  Memory (MB):
    value: '{{ .grains["iqlink-vm"].outputs.memory_mb }}'
  Disk Provisioning:
    value: '{{ .grains["iqlink-vm"].outputs.disk_provisioning }}'
  OVA:
    value: '{{ .grains["iqlink-vm"].outputs.ova_file }}'
  Next Step:
    value: 'Open the IQ Link Installer, choose your region, test connectivity, then pair with Cisco IQ (Home > System Settings > Data Connectors > Add Cisco IQ Link) within 5 minutes of the claim code appearing.'

grains:

  # ── 1. Deploy the OVA ───────────────────────────────────────────────────────
  # download-ova.sh caches the OVA on the runner before terraform init; the module
  # deploys it with local_ovf_path. Guest-network waits are 0 because the appliance
  # blocks at its first-boot console until the Day 0 grain configures it.
  iqlink-vm:
    kind: terraform
    spec:
      source:
        store: cisco-iq-stackautomation
        path: terraform/iqlink-ova
      target:
        name: '{{ .inputs.["Target"] }}'
      env-vars:
      - VSPHERE_ALLOW_UNVERIFIED_SSL: 'true'
      scripts:
        pre-tf-init:
          arguments: '{{ .inputs.["OVA URL"] }}'
          source:
            store: cisco-iq-stackautomation
            path: scripts/download-ova.sh
        pre-tf-destroy:
          arguments: '{{ .inputs.["OVA URL"] }} --placeholder'
          source:
            store: cisco-iq-stackautomation
            path: scripts/download-ova.sh
      inputs:
      - vm_name: '{{ .inputs.["VM Name"] }}'
      - ova_url: '{{ .inputs.["OVA URL"] }}'
      - datacenter: '{{ .inputs.["Datacenter"] }}'
      - cluster: '{% if .inputs.Placement == "Cluster" %}{{ .inputs.["Cluster"] }}{% endif %}'
      - host: '{{ .inputs.["Host"] }}'
      - datastore: '{{ .inputs.["Datastore"] }}'
      - folder: '{{ .inputs.["Folder"] }}'
      - port_group: '{{ .inputs.["Network"] }}'
      - disk_provisioning: '{{ .inputs.["Disk Provisioning"] }}'
      - num_cpus: '{% case .inputs.["Deployment Size"] %}{% when "1K devices" %}6{% when "10K devices" %}8{% when "20K devices" %}8{% when "50K devices" %}12{% else %}0{% endcase %}'
      - memory_mb: '{% case .inputs.["Deployment Size"] %}{% when "1K devices" %}12288{% when "10K devices" %}16384{% when "20K devices" %}18432{% when "50K devices" %}24576{% else %}0{% endcase %}'
      outputs:
      - vm_name
      - vm_uuid
      - vm_moid
      - num_cpu
      - memory_mb
      - power_state
      - datacenter
      - disk_provisioning
      - ova_file

  # ── 2. Day 0: first-boot console setup ──────────────────────────────────────
  # The shipped OVA has no vApp/OVF properties (no "Customize template" step), so the
  # network settings can only be entered on the console. This grain types them with
  # govc vm.keystrokes and reads the screen with OCR (see screenshots/README.md).
  iqlink-day0:
    kind: shell
    depends-on: iqlink-vm
    spec:
      target:
        name: '{{ .inputs.["Target"] }}'
      files:
      - source: cisco-iq-stackautomation
        path: scripts/iqlink_day0_console.sh
      env-vars:
      - VM_NAME: '{{ .grains["iqlink-vm"].outputs.vm_name }}'
      - DATACENTER: '{{ .inputs.["Datacenter"] }}'
      - MGMT_IP_CIDR: '{{ .inputs.["Management IP"] }}'
      - GATEWAY: '{{ .inputs.["Gateway"] }}'
      - DNS_LIST: '{{ .inputs.["DNS Servers"] }}'
      - SEARCH_DOMAIN: '{{ .inputs.["Search Domain"] }}'
      - NTP_LIST: '{{ .inputs.["NTP Servers"] }}'
      - ADMIN_PASSWORD: '{{ .inputs.["Admin Password"] }}'
      - NTP_POLL_PROMPT: '{% if .inputs.["IQ Link Version"] == "1.3.x" %}yes{% else %}no{% endif %}'
      activities:
        deploy:
          commands:
          - name: day0
            command: |
              set -eo pipefail
              log() { echo "[$(date -u +%H:%M:%S)] $*"; }

              # govc: use the runner's copy, else install a pinned release.
              GOVC_VERSION=0.36.3
              if command -v govc >/dev/null; then export GOVC="$(command -v govc)"
              else
                mkdir -p "$HOME/.local/bin"
                curl -fsSL "https://github.com/vmware/govmomi/releases/download/v${GOVC_VERSION}/govc_Linux_x86_64.tar.gz" | tar -xz -C "$HOME/.local/bin" govc
                export GOVC="$HOME/.local/bin/govc"
              fi
              log "govc: $($GOVC version)"

              # OCR for prompt detection (best effort; the script falls back to fixed delays).
              command -v tesseract >/dev/null || { apt-get install -y tesseract-ocr >/dev/null 2>&1 || (apt-get update >/dev/null 2>&1 && apt-get install -y tesseract-ocr >/dev/null 2>&1) || log "WARNING: tesseract unavailable"; }

              # vCenter credentials come from the target (VSPHERE_*); govc wants a hostname.
              export GOVC_URL="${VSPHERE_SERVER#https://}" GOVC_USERNAME="$VSPHERE_USER" GOVC_PASSWORD="$VSPHERE_PASSWORD"
              export GOVC_INSECURE=true GOVC_DATACENTER="$DATACENTER"

              # A VM inside a folder is not found by bare name; use its inventory path.
              VM_PATH=$($GOVC find "/${DATACENTER}/vm" -type m -name "$VM_NAME" | head -n1)
              [ -n "$VM_PATH" ] || { log "ERROR: VM $VM_NAME not found under /${DATACENTER}/vm"; exit 1; }
              export VM_NAME="$VM_PATH"

              # Reverse DNS is required by IQ Link; warn early if the PTR record is missing.
              IP="${MGMT_IP_CIDR%/*}"
              python3 -c "import socket,sys; print('PTR', socket.gethostbyaddr(sys.argv[1])[0])" "$IP" 2>/dev/null \
                || log "WARNING: no reverse DNS (PTR) for $IP as seen from the management server"

              bash ./iqlink_day0_console.sh
              export mgmt_ip="$IP"
              log "Day 0 complete: https://${mgmt_ip}"
            outputs:
            - mgmt_ip
        destroy:
          commands:
          - 'echo "Nothing to undo; the VM is removed by the iqlink-vm grain."'

instructions:
  source:
    store: cisco-iq-stackautomation
    path: instructions/cisco-iq-link.md

labels:
- Platform: vCenter
- Provider: Cisco
- Product: Cisco IQ Link

metadata:
  display-name: Cisco IQ Link
